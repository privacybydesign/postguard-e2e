# End-to-end harness (EPIC issue #207 / P0.5).
#
# Boots the full stack and runs the integration + golden-flow tests, with no
# phone and no browser. Triggers:
#   - schedule:        nightly
#   - pull_request:    on this repo when the harness/stack change
#   - push (main):     on a fixtures/** change, so the append-only gate runs
#                      against a direct push instead of waiting for the nightly
#                      ledger (issue #37)
#   - workflow_dispatch: manual
#   - workflow_call:   so other repos can gate on it, e.g.
#       jobs:
#         e2e:
#           uses: privacybydesign/postguard-e2e/.github/workflows/e2e.yml@main
#
# All dependencies are public (postguard, cryptify, privacybydesign/irmago), so
# no extra checkout secret is needed. The irma-server's JWT key is generated
# here (never committed).
name: e2e

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  # A direct push to `main` never opens a pull request, so the merge-base half
  # of the append-only gate below used to be skipped entirely and a deleted or
  # rewritten fixture was caught only whenever the nightly ledger next ran — up
  # to 24 hours late (issue #37). The path filter is narrower than the
  # pull_request one on purpose: this trigger exists for the corpus gates, and
  # `fixtures/**` covers both the artifacts and `CORPUS.sha256`.
  #
  # The other three jobs run too, which duplicates them on the normal merge
  # path. That is deliberate and cheap: an append-only corpus changes a handful
  # of times a year, the nightly already runs golden-flow every night, and on
  # the runs this trigger exists for — a push that bypassed review — nothing is
  # duplicated because no PR checks ever ran.
  push:
    branches: [main]
    paths:
      - 'fixtures/**'
  pull_request:
    paths:
      - 'yivi-driver/**'
      - 'stack/**'
      - 'fixtures/**'
      - 'fixtures-verify/**'
      - 'contracts/**'
      - 'compat/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  # Cross-repo version drift detector (issue #201, Phase 3). Reads the versions
  # each PostGuard repo declares (npm + GitHub) and fails on drift not tracked
  # in compat/manifest.json. Runs on the nightly schedule too, because drift is
  # introduced by OTHER repos' changes — not just PRs here.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check cross-repo version drift
        working-directory: compat
        env:
          # Raises the GitHub API rate limit for the cross-repo reads.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci && npm test && npm run check

  # Formatting gate: cargo fmt for the Rust verifier, gofmt for the Go driver.
  # Pure text checks — no builds, no native deps (gofmt doesn't compile, so
  # yivi-driver's CGO/sqlcipher requirement doesn't apply).
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup ships with the runner image; the organization only allows
      # GitHub-owned and verified actions, so no toolchain action here.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt
          rustup default stable

      - name: cargo fmt --check (fixtures-verify)
        working-directory: fixtures-verify
        run: cargo fmt --check

      - name: cargo fmt --check (fixtures/gen)
        working-directory: fixtures/gen
        run: cargo fmt --check

      # One writer crate per pinned pg-core, because cargo keeps one copy per
      # semver-compatible range — so 0.6.4 cannot sit beside the 0.6.1 pin in
      # fixtures/gen. A new crate directory needs a step here.
      - name: cargo fmt --check (fixtures/gen-0-6-4)
        working-directory: fixtures/gen-0-6-4
        run: cargo fmt --check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: gofmt (yivi-driver)
        run: |
          unformatted=$(gofmt -l yivi-driver)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            gofmt -d yivi-driver
            exit 1
          fi

  # Fast, stack-free archival guard (issues #206, #19/#23): every container in
  # the committed corpus must still open with the pinned published
  # @e4a/pg-wasm, with the @e4a/pg-js the ecosystem currently ships, and with
  # the current postguard main's pg-core. Red here means old ciphertexts in the
  # wild would fail the same way.
  #
  # The corpus is append-only, and this job is where that is enforced: the
  # digest ledger on every event, and the merge-base diff on pull requests.
  crypto-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout postguard-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: postguard-e2e
          # Full history: the append-only gate compares HEAD against a merge
          # base — with the PR's target branch on a pull_request, with the
          # previous tip of `main` on a push — and a shallow clone has no common
          # ancestor to compare against. The gate fails rather than passing
          # when it cannot find one, so a regression here goes red, not quiet.
          fetch-depth: 0

      # Unpinned on purpose — current pg-core is the thing under test here.
      - name: Checkout postguard (pg-core)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: privacybydesign/postguard
          path: postguard

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install corpus verifier deps
        working-directory: postguard-e2e/fixtures
        run: npm ci

      # The gates' own tests: they build a throwaway repository, delete and
      # edit a fixture in it, and assert the gate refuses. A gate only ever
      # observed reporting success has not been observed.
      - name: Test the append-only gate
        working-directory: postguard-e2e/fixtures
        run: npm test

      # Runs on every event, including the nightly schedule and a push that
      # never opened a pull request: the recorded digests are what make "these
      # bytes are frozen" a property of the repository rather than of review.
      - name: Check the corpus against its digest ledger
        working-directory: postguard-e2e/fixtures
        run: npm run ledger

      # The other half: the ledger says the bytes match what was recorded, this
      # says the recording itself was only ever appended to. It is the one check
      # that needs a base commit, so it runs on the two events that have one —
      # pull_request and push. On `schedule` and `workflow_dispatch` there is no
      # "before" to compare against and the ledger stands alone.
      #
      # `!cancelled()` so it still reports when the ledger step above already
      # failed. The two gates answer different questions and a tampered corpus
      # trips both; short-circuiting would mean the second one's verdict is
      # never seen precisely on the runs it exists for.
      - name: Enforce that the corpus is append-only
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        working-directory: postguard-e2e/fixtures
        env:
          # A base COMMIT, not a branch name, on both events — and note the gate
          # reduces whatever it is handed with `git merge-base <ref> HEAD`, which
          # is what makes one env var correct for two differently-shaped events:
          #
          #   pull_request: actions/checkout builds the PR's merge commit, so
          #     base.sha is exactly its first parent — no extra fetch needed.
          #   push: `before` is the previous tip of `main`. A fast-forward push
          #     makes it an ancestor of HEAD, so the merge base IS `before` and
          #     the diff is exactly the pushed range — for a squash, a merge
          #     commit or a rebase alike.
          #
          # A force-push is the one case where `before` is not an ancestor. Then
          # the merge base walks back to the fork point: a noisier diff, but a
          # deleted or rewritten fixture is still caught. If the old tip is
          # unreachable altogether, merge-base fails and the gate exits non-zero
          # rather than passing — see append-only.mjs, which names this case.
          PG_APPEND_ONLY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run append-only

      # No `!cancelled()` on either verify step, and that asymmetry with the
      # append-only step above is deliberate. That step answers a question the
      # ledger does not, so it is worth hearing even after a red ledger. These
      # two depend on a green ledger: "the reader opened it" and "the reader
      # rejected it" say nothing about bytes whose provenance is already in
      # doubt, so running them on an unverified corpus would only produce a
      # verdict nobody should trust.
      - name: Verify the corpus with the published JS readers
        working-directory: postguard-e2e/fixtures
        run: npm run verify

      # L1 contract check, stack-free half (issue #212): the PKG's canonical
      # condiscon examples must agree with its JSON Schema. The live half runs
      # in the golden-flow job (TestLiveContract).
      - name: Validate contract examples against the JSON Schema
        working-directory: postguard-e2e/contracts
        run: npm ci && npm run validate

      # No cargo cache: the cache action this job used is not on the
      # organization's allowlist, so the pg-core build is cold on every run.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # No --locked: pg-core is a path dep whose transitive versions follow
      # postguard main; pinning them here would only produce false reds.
      - name: Verify the corpus with current pg-core
        working-directory: postguard-e2e/fixtures-verify
        run: cargo run

  golden-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Check everything out as siblings under $GITHUB_WORKSPACE so the
      # `../../…` paths in stack/docker-compose.yml and yivi-driver/go.mod
      # resolve (postguard-e2e in its own subdir, deps one level up from it).
      - name: Checkout postguard-e2e
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: postguard-e2e

      # irmago is PINNED: it's an external dependency the yivi-driver builds
      # against (go.mod replace), not a system under test — an upstream API
      # change should not break this harness unannounced. Bump deliberately,
      # together with the go.mod replace target.
      - name: Checkout irmago (EUDI fork, pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: privacybydesign/irmago
          ref: de4b4b713f17e92c7181d45dbfdd848784e82b74
          path: irmago

      # postguard is deliberately UNPINNED (default branch): it is the system
      # under test — the whole point of the nightly run is to detect when its
      # `main` drifts against the harness/contracts (this already caught pg-pkg
      # making --allowed-origins mandatory). A red nightly here means "PostGuard
      # main changed behavior", not "the harness is broken".
      - name: Checkout postguard (PKG)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: privacybydesign/postguard
          path: postguard

      # cryptify is checked out UNPINNED for the same stated reason, and that
      # reason no longer holds: encryption4all/cryptify was archived on
      # 2026-08-09. Its default branch cannot drift, so this is a frozen June
      # snapshot dressed as a system under test — it predates the three security
      # fixes released as cryptify-v0.1.28 and the /metrics endpoint. Nothing
      # fails; the stack comes up and the nightly reports on stale code. See
      # encryption4all/postguard#312.
      #
      # The service moved into the postguard workspace in postguard#277 and is
      # already present in the checkout above at postguard/cryptify. Repointing
      # this (and stack/docker-compose.yml's `context: ../../cryptify`) is
      # blocked on cryptify/dev.Dockerfile becoming workspace-aware: cryptify
      # depends on pg-core by path and has no lockfile of its own, so it cannot
      # build with cryptify/ as the context. Tracked in
      # encryption4all/postguard#325 — delete this step as part of that.
      - name: Checkout cryptify (ARCHIVED — frozen, see postguard#325)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: encryption4all/cryptify
          path: cryptify

      - name: Install libsqlcipher (CGO dep of irmago's client)
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: postguard-e2e/yivi-driver/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Fetch the pinned, published irma-demo scheme (with sidn-pbdf.email +
      # issuer keys) that the irma-server serves and the holder trusts. Gitignored
      # + pinned, so this is the single source of the scheme for local and CI.
      - name: Provision irma-demo scheme
        working-directory: postguard-e2e/stack/schemes
        run: ./provision.sh

      - name: Generate throwaway irma-server JWT key
        # chmod 644: openssl creates the key 0600 (owner: runner), but the irma
        # container reads it through the bind mount as a different non-root
        # user. It's a throwaway test key, so world-readable is fine.
        run: |
          mkdir -p postguard-e2e/stack/irma
          openssl genrsa -out postguard-e2e/stack/irma/jwt_privkey.pem 2048
          chmod 644 postguard-e2e/stack/irma/jwt_privkey.pem

      # Provision an ephemeral business API key for this run. business-db
      # derives its seeded key_hash from this at init, and the golden flow
      # SKIPS without it — so this must be set before `compose up` and
      # exported to the test step, or CI silently loses the golden flow.
      - name: Generate ephemeral business API key
        run: echo "PG_API_KEY=PG-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      # A cold build of both Rust images plus the mode=max layer-cache export
      # needs more scratch space than a stock runner has free (~14 GB) — a
      # cold run died with "no space left on device". (Cold happens whenever
      # the GHA cache isn't visible: first run on a PR branch, cache eviction.)
      # Dropping the big preinstalled toolchains we never use frees ~25 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL to the shell so the
      # raw `buildx bake` below can use the type=gha cache backend.
      - name: Expose the Actions runtime to the shell
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL']) {
              core.exportVariable(name, process.env[name] || '');
            }

      # Build the two Rust images with the GitHub Actions layer cache
      # (issue #239). The expensive layer is cargo-chef's dependency compile;
      # it re-caches only when the upstream Cargo.lock changes, dropping a
      # warm run from ~20-30 min to a few minutes. Separate scopes so the two
      # images don't evict each other.
      #
      # Plain `buildx bake` from the stack directory (not the bake-action):
      # the compose file's relative build contexts (../../postguard) must
      # resolve against stack/, and running from there guarantees it.
      - name: Build stack images (GHA layer cache)
        working-directory: postguard-e2e/stack
        run: |
          # --allow fs.read: the build contexts (../../postguard, ../../cryptify)
          # sit outside stack/, which buildx's entitlement check requires
          # explicit permission for in non-interactive runs.
          docker buildx bake -f docker-compose.yml --load \
            --allow fs.read=../.. \
            --set 'postguard-pkg.cache-from=type=gha,scope=pkg' \
            --set 'postguard-pkg.cache-to=type=gha,scope=pkg,mode=max' \
            --set 'cryptify.cache-from=type=gha,scope=cryptify' \
            --set 'cryptify.cache-to=type=gha,scope=cryptify,mode=max'

      - name: Boot the stack
        working-directory: postguard-e2e/stack
        run: docker compose up -d --no-build

      - name: Wait for services healthy
        run: |
          check() {
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$1" || true)
              if [ "$code" = "200" ]; then echo "  $1 healthy"; return 0; fi
              sleep 5
            done
            echo "  $1 never became healthy"; return 1
          }
          check 8088/publickey
          check 8087/health
          check 8000/health

      - name: Install crypto-oracle deps
        working-directory: postguard-e2e/yivi-driver/oracle
        run: npm ci

      - name: Run e2e tests
        working-directory: postguard-e2e/yivi-driver
        # The SKIP guard exists because these tests skip (not fail) when their
        # preconditions are missing — right for local dev, but in CI a skipped
        # golden flow is silent coverage loss (it happened: the PG_API_KEY
        # provisioning refactor skipped it unnoticed until #239).
        run: |
          set -o pipefail
          go test ./... -count=1 -v 2>&1 | tee test.out
          # TestGenerateCryptoFixtures skips by design (generation is manual);
          # the flows below must actually run.
          if grep -qE -- '--- SKIP: (TestGoldenFlow|TestRealSdkGoldenFlow|TestEmailRecipientRoundTrip|TestPKGInitiatedDisclosureYieldsJWT|TestLiveContract)' test.out; then
            echo '::error::a mandatory e2e test was SKIPPED in CI — its preconditions broke (see above)'
            exit 1
          fi

      - name: Stack logs (on failure)
        if: failure()
        working-directory: postguard-e2e/stack
        run: |
          echo "::group::irma-server";  docker compose logs --no-color irma-server;  echo "::endgroup::"
          echo "::group::irma-ready";   docker compose logs --no-color irma-ready;   echo "::endgroup::"
          echo "::group::postguard-pkg"; docker compose logs --no-color postguard-pkg; echo "::endgroup::"
          echo "::group::cryptify";     docker compose logs --no-color cryptify;     echo "::endgroup::"
          echo "::group::business-db";  docker compose logs --no-color business-db;  echo "::endgroup::"

      - name: Tear down
        if: always()
        working-directory: postguard-e2e/stack
        run: docker compose down -v
