# End-to-end harness (EPIC issue #207 / P0.5).
#
# Boots the full stack and runs the integration + golden-flow tests, with no
# phone and no browser. Triggers:
#   - schedule:        nightly
#   - pull_request:    on this repo when the harness/stack change
#   - workflow_dispatch: manual
#   - workflow_call:   so other repos can gate on it, e.g.
#       jobs:
#         e2e:
#           uses: encryption4all/postguard-e2e/.github/workflows/e2e.yml@main
#
# All dependencies are public (postguard, cryptify, privacybydesign/irmago), so
# no extra checkout secret is needed. The irma-server's JWT key is generated
# here (never committed).
name: e2e

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  pull_request:
    paths:
      - 'yivi-driver/**'
      - 'stack/**'
      - 'fixtures/**'
      - 'fixtures-verify/**'
      - 'contracts/**'
      - '.github/workflows/e2e.yml'

jobs:
  # Formatting gate: cargo fmt for the Rust verifier, gofmt for the Go driver.
  # Pure text checks — no builds, no native deps (gofmt doesn't compile, so
  # yivi-driver's CGO/sqlcipher requirement doesn't apply).
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check (fixtures-verify)
        working-directory: fixtures-verify
        run: cargo fmt --check

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: gofmt (yivi-driver)
        run: |
          unformatted=$(gofmt -l yivi-driver)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            gofmt -d yivi-driver
            exit 1
          fi

  # Fast, stack-free wire-format guard (issue #206): the committed golden
  # ciphertexts must unseal with BOTH the pinned published @e4a/pg-wasm (client
  # side) and the current postguard main's pg-core (drift detector). Red here
  # means old ciphertexts in the wild would fail the same way.
  crypto-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout postguard-e2e
        uses: actions/checkout@v7
        with:
          path: postguard-e2e

      # Unpinned on purpose — current pg-core is the thing under test here.
      - name: Checkout postguard (pg-core)
        uses: actions/checkout@v7
        with:
          repository: encryption4all/postguard
          path: postguard

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify with published pg-wasm
        working-directory: postguard-e2e/fixtures
        run: npm ci && npm run verify

      # L1 contract check, stack-free half (issue #212): the PKG's canonical
      # condiscon examples must agree with its JSON Schema. The live half runs
      # in the golden-flow job (TestLiveContract).
      - name: Validate contract examples against the JSON Schema
        working-directory: postguard-e2e/contracts
        run: npm ci && npm run validate

      - uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry + target dir (keyed on the manifests), so
      # the pg-core build here takes seconds on a warm cache (issue #239).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: postguard-e2e/fixtures-verify

      # No --locked: pg-core is a path dep whose transitive versions follow
      # postguard main; pinning them here would only produce false reds.
      - name: Verify with current pg-core
        working-directory: postguard-e2e/fixtures-verify
        run: cargo run
  golden-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Check everything out as siblings under $GITHUB_WORKSPACE so the
      # `../../…` paths in stack/docker-compose.yml and yivi-driver/go.mod
      # resolve (postguard-e2e in its own subdir, deps one level up from it).
      - name: Checkout postguard-e2e
        uses: actions/checkout@v7
        with:
          path: postguard-e2e

      # irmago is PINNED: it's an external dependency the yivi-driver builds
      # against (go.mod replace), not a system under test — an upstream API
      # change should not break this harness unannounced. Bump deliberately,
      # together with the go.mod replace target.
      - name: Checkout irmago (EUDI fork, pinned)
        uses: actions/checkout@v7
        with:
          repository: privacybydesign/irmago
          ref: de4b4b713f17e92c7181d45dbfdd848784e82b74
          path: irmago

      # postguard and cryptify are deliberately UNPINNED (default branch):
      # they are the systems under test — the whole point of the nightly run
      # is to detect when their `main` drifts against the harness/contracts
      # (this already caught pg-pkg making --allowed-origins mandatory). A
      # red nightly here means "PostGuard main changed behavior", not "the
      # harness is broken".
      - name: Checkout postguard (PKG)
        uses: actions/checkout@v7
        with:
          repository: encryption4all/postguard
          path: postguard

      - name: Checkout cryptify
        uses: actions/checkout@v7
        with:
          repository: encryption4all/cryptify
          path: cryptify

      - name: Install libsqlcipher (CGO dep of irmago's client)
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: postguard-e2e/yivi-driver/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate throwaway irma-server JWT key
        # chmod 644: openssl creates the key 0600 (owner: runner), but the irma
        # container reads it through the bind mount as a different non-root
        # user. It's a throwaway test key, so world-readable is fine.
        run: |
          mkdir -p postguard-e2e/stack/irma
          openssl genrsa -out postguard-e2e/stack/irma/jwt_privkey.pem 2048
          chmod 644 postguard-e2e/stack/irma/jwt_privkey.pem

      # Provision an ephemeral business API key for this run. business-db
      # derives its seeded key_hash from this at init, and the golden flow
      # SKIPS without it — so this must be set before `compose up` and
      # exported to the test step, or CI silently loses the golden flow.
      - name: Generate ephemeral business API key
        run: echo "PG_API_KEY=PG-$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      # A cold build of both Rust images plus the mode=max layer-cache export
      # needs more scratch space than a stock runner has free (~14 GB) — a
      # cold run died with "no space left on device". (Cold happens whenever
      # the GHA cache isn't visible: first run on a PR branch, cache eviction.)
      # Dropping the big preinstalled toolchains we never use frees ~25 GB.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL to the shell so the
      # raw `buildx bake` below can use the type=gha cache backend.
      - uses: crazy-max/ghaction-github-runtime@v3

      # Build the two Rust images with the GitHub Actions layer cache
      # (issue #239). The expensive layer is cargo-chef's dependency compile;
      # it re-caches only when the upstream Cargo.lock changes, dropping a
      # warm run from ~20-30 min to a few minutes. Separate scopes so the two
      # images don't evict each other.
      #
      # Plain `buildx bake` from the stack directory (not the bake-action):
      # the compose file's relative build contexts (../../postguard) must
      # resolve against stack/, and running from there guarantees it.
      - name: Build stack images (GHA layer cache)
        working-directory: postguard-e2e/stack
        run: |
          # --allow fs.read: the build contexts (../../postguard, ../../cryptify)
          # sit outside stack/, which buildx's entitlement check requires
          # explicit permission for in non-interactive runs.
          docker buildx bake -f docker-compose.yml --load \
            --allow fs.read=../.. \
            --set 'postguard-pkg.cache-from=type=gha,scope=pkg' \
            --set 'postguard-pkg.cache-to=type=gha,scope=pkg,mode=max' \
            --set 'cryptify.cache-from=type=gha,scope=cryptify' \
            --set 'cryptify.cache-to=type=gha,scope=cryptify,mode=max'

      - name: Boot the stack
        working-directory: postguard-e2e/stack
        run: docker compose up -d --no-build

      - name: Wait for services healthy
        run: |
          check() {
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$1" || true)
              if [ "$code" = "200" ]; then echo "  $1 healthy"; return 0; fi
              sleep 5
            done
            echo "  $1 never became healthy"; return 1
          }
          check 8088/publickey
          check 8087/health
          check 8000/health

      - name: Install crypto-oracle deps
        working-directory: postguard-e2e/yivi-driver/oracle
        run: npm ci

      - name: Run e2e tests
        working-directory: postguard-e2e/yivi-driver
        # The SKIP guard exists because these tests skip (not fail) when their
        # preconditions are missing — right for local dev, but in CI a skipped
        # golden flow is silent coverage loss (it happened: the PG_API_KEY
        # provisioning refactor skipped it unnoticed until #239).
        run: |
          set -o pipefail
          go test ./... -count=1 -v 2>&1 | tee test.out
          # TestGenerateCryptoFixtures skips by design (generation is manual);
          # the flows below must actually run.
          if grep -qE -- '--- SKIP: (TestGoldenFlow|TestPKGInitiatedDisclosureYieldsJWT|TestLiveContract)' test.out; then
            echo '::error::a mandatory e2e test was SKIPPED in CI — its preconditions broke (see above)'
            exit 1
          fi

      - name: Stack logs (on failure)
        if: failure()
        working-directory: postguard-e2e/stack
        run: |
          echo "::group::irma-server";  docker compose logs --no-color irma-server;  echo "::endgroup::"
          echo "::group::irma-ready";   docker compose logs --no-color irma-ready;   echo "::endgroup::"
          echo "::group::postguard-pkg"; docker compose logs --no-color postguard-pkg; echo "::endgroup::"
          echo "::group::cryptify";     docker compose logs --no-color cryptify;     echo "::endgroup::"
          echo "::group::business-db";  docker compose logs --no-color business-db;  echo "::endgroup::"

      - name: Tear down
        if: always()
        working-directory: postguard-e2e/stack
        run: docker compose down -v
