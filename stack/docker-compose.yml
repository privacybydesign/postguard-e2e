# Self-contained e2e stack for the PostGuard harness.
#
# Unlike postguard-website's dev compose, the irma-server here is wired to
# irmago's bundled TEST schemes + issuer PRIVATE keys, so a headless holder can
# issue itself a credential and disclose it — the thing that makes automated
# end-to-end (incl. decryption) possible. See EPIC issues #203 / #204.
#
# Build contexts point at the sibling working checkouts so we test CURRENT code
# (e.g. the in-flight condiscon branch), not published images.
#
#   ../../postguard        -> the PKG (this repo's sibling)
#   ../../irmago           -> Yivi test schemes + issuer private keys
#   ../../postguard-website/docker/irma/jwt_privkey.pem -> irma-server JWT signing key

services:
    # Yivi/IRMA server, configured for issuance of the bundled test schemes.
    irma-server:
        image: ghcr.io/privacybydesign/irma:latest
        # The server WRITES into --schemes-path at startup (it bootstraps the
        # default pbdf scheme there even with --schemes-update 0), so that path
        # is a tmpfs (mode 1777 — writable by the image's non-root user) and the
        # irmago testdata is mounted READ-ONLY as --schemes-assets-path, which
        # the server copies into the schemes path itself. Mounting the checkout
        # directly both mutates it (pollutes the irmago working tree) and fails
        # on CI where the bind mount isn't writable by the container user.
        command: >
            server --no-auth -v
            --url http://localhost:8088
            --schemes-path /schemes
            --schemes-assets-path /irma/schemes-assets
            --privkeys /irma/privkeys
            --schemes-update 0
            --jwt-privkey-file /etc/irma/jwt_privkey.pem
        ports:
            - '8088:8088'
        tmpfs:
            - /schemes
        volumes:
            - ../../irmago/testdata/irma_configuration:/irma/schemes-assets:ro
            - ../../irmago/testdata/privatekeys:/irma/privkeys:ro
            # Throwaway JWT signing key, generated locally / in CI (gitignored):
            #   openssl genrsa -out irma/jwt_privkey.pem 2048
            - ./irma/jwt_privkey.pem:/etc/irma/jwt_privkey.pem:ro
        networks: [pg]

    # One-shot gate: the irma image is shell-less (no healthcheck possible), and
    # the PKG fetches irma-server's /publickey once at boot and CRASHES if it's
    # not reachable yet. This blocks the PKG until /publickey actually responds.
    irma-ready:
        image: curlimages/curl:latest
        # Bounded so a broken irma-server fails the stack fast (instead of
        # hanging `up` until the job timeout, hiding the logs).
        # $$ so compose doesn't interpolate the shell variable itself.
        command: ['sh', '-c', 'for i in $$(seq 1 90); do curl -sf http://irma-server:8088/publickey >/dev/null 2>&1 && { echo "irma-server ready after $$i tries"; exit 0; }; echo "waiting for irma-server ($$i)…"; sleep 2; done; echo "irma-server never became ready"; exit 1']
        depends_on:
            - irma-server
        networks: [pg]

    # Private Key Generator (built from the sibling ../../postguard working tree).
    postguard-pkg:
        build:
            context: ../../postguard
            dockerfile: dev.Dockerfile
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8087/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_interval: 2s
            start_period: 60s
        ports:
            - '8087:8087'
        environment:
            - IRMA_SERVER=http://irma-server:8088
            # Enables API-key auth (PG-… bearer) validated against business-db.
            - DATABASE_URL=postgresql://postguard:postguard@business-db:5432/postguard
            - RUST_LOG=info
            - RUST_BACKTRACE=1
        volumes:
            - ../../postguard:/app
            - pkg-target:/app/target
        depends_on:
            irma-ready:
                condition: service_completed_successfully
            business-db:
                condition: service_healthy
        networks: [pg]

    # Minimal postguard-business DB: just the tables the PKG's API-key lookup
    # reads, seeded with one org + one API key (see business-db/seed.sql).
    business-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=postguard
            - POSTGRES_PASSWORD=postguard
            - POSTGRES_DB=postguard
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postguard -d postguard']
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        # No persistent volume: the DB is ephemeral so editing seed.sql and
        # recreating the container re-applies it (Postgres only runs
        # /docker-entrypoint-initdb.d scripts on an empty data dir).
        volumes:
            - ./business-db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
        networks: [pg]

    # Encrypted file host + email delivery (built from ../../cryptify working tree).
    # Its conf/config.dev.toml already points pkg_url -> postguard-pkg and
    # smtp -> mailcrab, matching the service names here.
    cryptify:
        build:
            context: ../../cryptify
            dockerfile: dev.Dockerfile
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_interval: 2s
            start_period: 60s
        ports:
            - '8000:8000'
        environment:
            - ROCKET_CONFIG=/app/config.toml
            - RUST_LOG=info
            - RUST_BACKTRACE=1
        volumes:
            - ../../cryptify/conf/config.dev.toml:/app/config.toml:ro
            - ../../cryptify/src:/app/src
            - ../../cryptify/templates:/app/templates
            - ../../cryptify/build.rs:/app/build.rs:ro
            - ../../cryptify/Cargo.lock:/app/Cargo.lock:ro
            - cryptify-data:/app/data
            - cryptify-target:/app/target
        depends_on:
            postguard-pkg:
                condition: service_healthy
        networks: [pg]

    # SMTP sink so recipient-notification emails are captured, not sent.
    # Web UI on :1080, SMTP on :1025.
    mailcrab:
        image: marlonb/mailcrab:latest
        ports:
            - '1080:1080'
            - '1025:1025'
        networks: [pg]

networks:
    pg:
        driver: bridge

volumes:
    pkg-target:
    cryptify-data:
    cryptify-target:
