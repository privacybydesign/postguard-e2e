# Self-contained e2e stack for the PostGuard harness.
#
# The irma-server here is wired to the REAL, published irma-demo scheme (with
# issuer PRIVATE keys), so a headless holder can issue itself a credential —
# including an actual sidn-pbdf.email identity — and disclose it, which is what
# makes automated end-to-end (incl. decryption via the real SDK) possible. See
# EPIC issues #203 / #204 and #236. Run `stack/schemes/provision.sh` first (it's
# pinned + gitignored); CI runs it before boot.
#
# Build contexts point at the sibling working checkouts so we test CURRENT code
# (e.g. the in-flight condiscon branch), not published images.
#
#   ../../postguard          -> the PKG (this repo's sibling)
#   ./schemes/irma_configuration -> pinned irma-demo scheme (provision.sh)

services:
    # Yivi/IRMA server, configured for issuance of the bundled test schemes.
    irma-server:
        image: ghcr.io/privacybydesign/irma:latest
        # The server WRITES into --schemes-path at startup (it bootstraps the
        # default pbdf scheme there even with --schemes-update 0), so that path
        # is a tmpfs (mode 1777 — writable by the image's non-root user) and the
        # scheme is mounted READ-ONLY as --schemes-assets-path, which the server
        # copies into the schemes path itself. Mounting the checkout directly
        # both mutates it and fails on CI where the bind mount isn't writable by
        # the container user.
        #
        # No --privkeys: the published irma-demo scheme carries the issuer
        # private keys inline (<issuer>/PrivateKeys/*.xml), which the server
        # loads directly, so no separate key directory is needed.
        command: >
            server --no-auth -v
            --url http://localhost:8088
            --schemes-path /schemes
            --schemes-assets-path /irma/schemes-assets
            --schemes-update 0
            --jwt-privkey-file /etc/irma/jwt_privkey.pem
        ports:
            - '8088:8088'
        tmpfs:
            - /schemes
        volumes:
            # Pinned irma-demo scheme provisioned by stack/schemes/provision.sh.
            # The dir holds irma_configuration/irma-demo/ (incl. sidn-pbdf.email
            # + inline issuer private keys).
            - ./schemes/irma_configuration:/irma/schemes-assets:ro
            # Throwaway JWT signing key, generated locally / in CI (gitignored):
            #   openssl genrsa -out irma/jwt_privkey.pem 2048
            - ./irma/jwt_privkey.pem:/etc/irma/jwt_privkey.pem:ro
        networks: [pg]

    # One-shot gate: the irma image is shell-less (no healthcheck possible), and
    # the PKG fetches irma-server's /publickey once at boot and CRASHES if it's
    # not reachable yet. This blocks the PKG until /publickey actually responds.
    irma-ready:
        image: curlimages/curl:latest
        # Bounded so a broken irma-server fails the stack fast (instead of
        # hanging `up` until the job timeout, hiding the logs).
        # $$ so compose doesn't interpolate the shell variable itself.
        command: ['sh', '-c', 'for i in $$(seq 1 90); do curl -sf http://irma-server:8088/publickey >/dev/null 2>&1 && { echo "irma-server ready after $$i tries"; exit 0; }; echo "waiting for irma-server ($$i)…"; sleep 2; done; echo "irma-server never became ready"; exit 1']
        depends_on:
            - irma-server
        networks: [pg]

    # Private Key Generator (built from the sibling ../../postguard working tree).
    postguard-pkg:
        # Stable tag so CI can pre-build via buildx bake (GHA layer cache) and
        # `up --no-build` picks it up; a plain local `up` still builds it.
        image: postguard-e2e-pkg:dev
        build:
            context: ../../postguard
            dockerfile: dev.Dockerfile
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8087/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_interval: 2s
            start_period: 60s
        ports:
            - '8087:8087'
        environment:
            - IRMA_SERVER=http://irma-server:8088
            # Enables API-key auth (PG-… bearer) validated against business-db.
            - DATABASE_URL=postgresql://postguard:postguard@business-db:5432/postguard
            # Required since the PKG made its CORS allowlist mandatory. The
            # harness drives the API from Go (no browser), so wildcard is fine
            # here; never use `*` on a real deployment.
            - PKG_ALLOWED_ORIGINS=*
            # Sign API-key identities with the demo email type, since this stack
            # can only issue irma-demo credentials (postguard#236). Must match
            # cryptify's ROCKET_EMAIL_ATTRIBUTE and the SDK's emailAttributes.
            - PKG_EMAIL_ATTRIBUTE=irma-demo.sidn-pbdf.email.email
            - RUST_LOG=info
        volumes:
            - ../../postguard:/app
            - pkg-target:/app/target
        depends_on:
            irma-ready:
                condition: service_completed_successfully
            # Not business-db directly: the PKG must not start until the schema
            # and seed are in place, and business-migrate already waits for the
            # database to be healthy.
            business-migrate:
                condition: service_completed_successfully
        networks: [pg]

    # postguard-business's database, with postguard-business's OWN schema:
    # business-schema-source fetches its drizzle migrations and business-migrate
    # applies them, then seeds data on top. Empty until those two have run.
    business-db:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=postguard
            - POSTGRES_PASSWORD=postguard
            - POSTGRES_DB=postguard
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postguard -d postguard']
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        networks: [pg]

    # One-shot: fetch the business schema from its owner. postguard-business is
    # public and UNPINNED by default, for the same reason ../../postguard is —
    # it is a system under test, and a migration there that moves a column the
    # PKG reads must fail this stack. Set PGB_REF to pin a local run.
    business-schema-source:
        image: alpine/git:latest
        # entrypoint + command rather than entrypoint alone: overriding only the
        # entrypoint leaves the image's CMD appended as a stray argument.
        entrypoint: ['/bin/sh']
        command: ['/provision/fetch-migrations.sh']
        environment:
            - PGB_REPO
            - PGB_REF
        volumes:
            - ./business-db:/provision:ro
            - business-migrations:/src
        networks: [pg]

    # One-shot: apply those migrations to business-db, then seed test DATA on
    # top (seed-data.sql carries no DDL). Runs on every `up`, dropping and
    # rebuilding the schema, so a stale anonymous volume cannot hide drift.
    business-migrate:
        image: postgres:16-alpine
        entrypoint: ['/bin/sh']
        command: ['/provision/provision.sh']
        environment:
            - PGHOST=business-db
            - PGUSER=postguard
            - PGPASSWORD=postguard
            - PGDATABASE=postguard
            # Passed through from the host env; provision.sh derives
            # key_hash = sha256(PG_API_KEY). Unset => no key row seeded.
            - PG_API_KEY
        volumes:
            - ./business-db:/provision:ro
            - business-migrations:/src:ro
        depends_on:
            business-db:
                condition: service_healthy
            business-schema-source:
                condition: service_completed_successfully
        networks: [pg]

    # Encrypted file host + email delivery (built from ../../cryptify working tree).
    # Its conf/config.dev.toml already points pkg_url -> postguard-pkg and
    # smtp -> mailcrab, matching the service names here.
    #
    # ../../cryptify is a checkout of encryption4all/cryptify, which is ARCHIVED:
    # this builds a frozen snapshot, not current cryptify. The service lives at
    # postguard/cryptify now, and moving this context there is blocked on
    # cryptify/dev.Dockerfile becoming workspace-aware (it depends on pg-core by
    # path and has no lockfile of its own). See encryption4all/postguard#325.
    cryptify:
        image: postguard-e2e-cryptify:dev
        build:
            context: ../../cryptify
            dockerfile: dev.Dockerfile
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_interval: 2s
            start_period: 60s
        ports:
            - '8000:8000'
        environment:
            - ROCKET_CONFIG=/app/config.toml
            # The sender's email attribute type in the signing identity. Must
            # match the PKG's PKG_EMAIL_ATTRIBUTE (postguard#236) — this stack
            # issues irma-demo credentials, so the demo type is what arrives.
            # ROCKET_-prefixed env is merged by cryptify's figment config.
            - ROCKET_EMAIL_ATTRIBUTE=irma-demo.sidn-pbdf.email.email
            - RUST_LOG=info
        volumes:
            - ../../cryptify/conf/config.dev.toml:/app/config.toml:ro
            - ../../cryptify/src:/app/src
            - ../../cryptify/templates:/app/templates
            - ../../cryptify/build.rs:/app/build.rs:ro
            - ../../cryptify/Cargo.lock:/app/Cargo.lock:ro
            - cryptify-data:/app/data
            - cryptify-target:/app/target
        depends_on:
            postguard-pkg:
                condition: service_healthy
        networks: [pg]

    # SMTP sink so recipient-notification emails are captured, not sent.
    # Web UI on :1080, SMTP on :1025.
    mailcrab:
        image: marlonb/mailcrab:latest
        ports:
            - '1080:1080'
            - '1025:1025'
        networks: [pg]

networks:
    pg:
        driver: bridge

volumes:
    pkg-target:
    cryptify-data:
    cryptify-target:
    # postguard-business checkout shared between the two one-shots above.
    business-migrations:
